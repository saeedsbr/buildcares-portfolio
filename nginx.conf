server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect /index.html to / for clean URLs
    if ($request_uri ~* "^/index\.html(.*)$") {
        return 301 /$1;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
